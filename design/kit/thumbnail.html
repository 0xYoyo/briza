<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}body{width:1280px;height:854px;display:flex}
.main{flex:0 0 75%;background:var(--navy-900);display:grid;place-items:center}
.mark{font-family:var(--font-display);font-size:300px;line-height:1;color:var(--ice-100);letter-spacing:var(--track-sign);text-shadow:var(--glow-sign)}
.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><span class="mark">בריזה</span></div>
<div class="strip">
<div style="background:var(--ice-200)"></div>
<div style="background:var(--ice-400)"></div>
<div style="background:var(--blue-600)"></div>
<div style="background:var(--coral-600)"></div>
</div></body></html>
